# Publishes the npm packages and wheels of a published GitHub release. It runs
# only by hand, from main, after the hashes are committed. CONTRIBUTING.md has
# the order, and the first publish needs NPM_TOKEN, as it says there.
name: Publish packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 0.3.0
        required: true

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download and check the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release download "v$VERSION" --dir release
          for f in release/*.tar.gz release/*.zip; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
      - name: Build the npm package
        working-directory: packages/sdk
        run: npm ci && npm run build
      - name: Build the packages from the release
        run: go run ./scripts/buildpackages -out dist/packages release
      - name: Publish to npm, platform packages first
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in dist/packages/npm/cli-* dist/packages/npm/sendscore; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "./$dir" --access public --provenance
            fi
          done
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/packages/python
          skip-existing: true
