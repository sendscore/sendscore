name: Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  bundled:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the npm package
        working-directory: packages/sdk
        run: npm ci && npm run build
      - name: Install the bundled packages and run conformance
        run: bash scripts/test-bundled.sh

  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [22]
        include:
          - os: ubuntu-latest
            runtime: 20
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the CLI
        working-directory: .
        run: |
          exe=sendscore
          if [ "$RUNNER_OS" = Windows ]; then exe=sendscore.exe; fi
          go build -o "bin/$exe" .
          echo "SENDSCORE_BIN=$GITHUB_WORKSPACE/bin/$exe" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.runtime }}
      - run: npm ci
      - run: npm test

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: ['3.12']
        include:
          - os: ubuntu-latest
            runtime: '3.10'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: packages/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the CLI
        working-directory: .
        run: |
          exe=sendscore
          if [ "$RUNNER_OS" = Windows ]; then exe=sendscore.exe; fi
          go build -o "bin/$exe" .
          echo "SENDSCORE_BIN=$GITHUB_WORKSPACE/bin/$exe" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.runtime }}
      - run: PYTHONPATH=src python -m unittest discover -s tests

  php:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: ['8.3']
        include:
          - os: ubuntu-latest
            runtime: '8.1'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: packages/php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the CLI
        working-directory: .
        run: |
          exe=sendscore
          if [ "$RUNNER_OS" = Windows ]; then exe=sendscore.exe; fi
          go build -o "bin/$exe" .
          echo "SENDSCORE_BIN=$GITHUB_WORKSPACE/bin/$exe" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.runtime }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [stable]
        include:
          - os: ubuntu-latest
            runtime: '1.88'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the CLI
        working-directory: .
        run: |
          exe=sendscore
          if [ "$RUNNER_OS" = Windows ]; then exe=sendscore.exe; fi
          go build -o "bin/$exe" .
          echo "SENDSCORE_BIN=$GITHUB_WORKSPACE/bin/$exe" >> "$GITHUB_ENV"
      - run: rustup toolchain install "${{ matrix.runtime }}" --profile minimal
      - run: cargo "+${{ matrix.runtime }}" test --locked

  ruby:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: ['3.3']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the CLI
        working-directory: .
        run: |
          exe=sendscore
          if [ "$RUNNER_OS" = Windows ]; then exe=sendscore.exe; fi
          go build -o "bin/$exe" .
          echo "SENDSCORE_BIN=$GITHUB_WORKSPACE/bin/$exe" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.runtime }}
      - run: for f in test/*_test.rb; do ruby -Ilib -Itest "$f"; done

  elixir:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: ['1.18']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: packages/elixir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the CLI
        working-directory: .
        run: |
          exe=sendscore
          if [ "$RUNNER_OS" = Windows ]; then exe=sendscore.exe; fi
          go build -o "bin/$exe" .
          echo "SENDSCORE_BIN=$GITHUB_WORKSPACE/bin/$exe" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        if: runner.os != 'macOS'
        with:
          elixir-version: ${{ matrix.runtime }}
          otp-version: '27'
      - if: runner.os == 'macOS'
        run: brew install elixir
      - run: mix test

  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: ['17']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: packages/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the CLI
        working-directory: .
        run: |
          exe=sendscore
          if [ "$RUNNER_OS" = Windows ]; then exe=sendscore.exe; fi
          go build -o "bin/$exe" .
          echo "SENDSCORE_BIN=$GITHUB_WORKSPACE/bin/$exe" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.runtime }}
      - run: mvn -B test

  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: ['8.0.x']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the CLI
        working-directory: .
        run: |
          exe=sendscore
          if [ "$RUNNER_OS" = Windows ]; then exe=sendscore.exe; fi
          go build -o "bin/$exe" .
          echo "SENDSCORE_BIN=$GITHUB_WORKSPACE/bin/$exe" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.runtime }}
      - run: dotnet test test/SendScore.Tests
