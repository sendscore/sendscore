[package]
name = "sendscore"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Check a newsletter email before it goes out. A typed wrapper around the SendScore CLI."
license = "MIT"
repository = "https://github.com/sendscore/sendscore"
readme = "README.md"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
